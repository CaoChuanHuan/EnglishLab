function modernIcons(){const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('script,style,svg,select,textarea')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);const pattern=/(🏠|🗺|🌍|🌈|🏡|🏓|🎒|⭐|✦|🌻|🏅|🔥|💎|🎧|🌿|🌱|🏆|🎯|🚩|🐱|🔒|🧩)\uFE0F?/gu;for(const n of nodes){if(!pattern.test(n.textContent)){pattern.lastIndex=0;continue}pattern.lastIndex=0;const span=document.createElement('span');span.innerHTML=n.textContent.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])).replace(pattern,m=>gameIcon(iconMap[m.replace(/\uFE0F/g,'')]));n.replaceWith(span)}}

const views={home:bro=>`<div class="premium-world"><div class="world-brand"><span>PINGPONG</span><b>English Lab</b><small>打好英语基本功，去更大的世界！</small></div><div class="player-hud"><div class="avatar-dot">${bro?'D':'J'}</div><div><b>${bro?'弟弟 · 新手探险家':'姐姐 · 小小乒乓选手'}</b><small>${s.suitName||'星云装备'} · Lv.${bro?1:5} · 本周 ${bro?'4 / 8':'11 / 15'} 个新词</small><div class="xp-bar"><i style="width:65%"></i></div></div><strong>${gameIcon('gem')} ${bro?20:s.points}</strong></div><div class="world-actions"><button onclick="missionDialog()">${gameIcon('flag')}任务</button><button onclick="equipmentDialog()">${gameIcon('bag')}装扮</button><button onclick="go('growth')">${gameIcon('trophy')}奖励</button></div><div class="island-markers"><button class="island forest" onclick="go('learn')">${gameIcon('leaf')}<span>单词森林<small>${bro?'4 / 8':'11 / 15'} · 词汇探索</small></span></button><button class="island arena" onclick="go('match')">${gameIcon('trophy')}<span>竞技广场<small>三局两胜 · 可续赛</small></span></button><button class="island grammar" onclick="go('learn')">${gameIcon('star')}<span>语法山脉<small>自建句型演示</small></span></button><button class="island coast" onclick="go('learn')">${gameIcon('headphones')}<span>听力海岸<small>听音练习</small></span></button><button class="island castle" onclick="go('map')">${gameIcon('map')}<span>阅读城堡<small>探索课程地图</small></span></button></div><div class="world-taskpanel"><div class="row"><h2>今日任务</h2><span>演示计划</span></div><button class="world-task" onclick="go('learn')">${gameIcon('leaf')}<span><b>单词训练</b><small>${bro?'认识生活里的颜色':'复习词汇与句意'}</small></span><em>开始</em></button><button class="world-task" onclick="go('learn')">${gameIcon('headphones')}<span><b>听力挑战</b><small>听一听，选择答案</small></span><em>开始</em></button><button class="world-task" onclick="go('match')">${gameIcon('paddle')}<span><b>乒乓球练习</b><small>两分领先 · 比分保存</small></span><em>继续</em></button><button class="world-task" onclick="missionDialog()">${gameIcon('flag')}<span><b>周／月任务</b><small>学习量＋质量验证</small></span><em>查看</em></button><div class="task-foot">约 ${bro?10:15} 分钟 · 随时可以休息</div></div>${s.build?`<button class="island" style="left:9%;top:69%" onclick="buildDialog()">${gameIcon('flag')}<span>${s.build}<small>已放置的演示装饰</small></span></button>`:''}<div class="world-bottom"><div class="daily-loot"><b>成长之路 · 连续 ${s.fixed?7:3} 天</b><div>${[1,2,3,4,5].map((n)=>`<button aria-label="查看第 ${n} 阶段奖励" onclick="go('growth')">${gameIcon(n<=3?'trophy':'lock')}</button>`).join('')}</div></div><button class="world-launch" onclick="go('learn')">继续挑战 <span>→</span></button></div></div><div class="world-under"><button onclick="buildDialog()">${gameIcon('home')} 我的营地 · 建造预览</button><span>原创美术场景 · 演示数据 · 教材内容待核实</span><button onclick="go('parent')">家长学习报告 →</button></div>`,map:bro=>`<h1>🗺 选择下一座岛屿</h1><p>${bro?'零基础启蒙 · 从生活开始':'人教精通 · 六年级上册 · 封面已确认'}</p><div class="notice">以下均为自建演示内容，尚未映射真实教材目录。</div><div class="two" style="margin-top:24px">${['🌈 颜色小岛','🏓 运动基地','🏡 生活街区','🌍 远方世界'].map((x,i)=>`<div class="card map-tile"><h2>${x}</h2><p>${i===0?'听说、认读与简单表达':'课程准备中'}</p><button ${i?'disabled':''} onclick="go('learn')">${i?'尚未上线':'进入探索 →'}</button></div>`).join('')}</div>`,learn:bro=>`<button class="link" onclick="go('home')">← 今日学习</button><h1>${bro?'听一听，找出红色':'把句子放进生活里'}</h1><p>自建演示题 · ${bro?'听音辨认':'句型理解'} · 不计真实学习时长</p><div class="card"><span class="pill">第 1 / 3 步</span><div style="font-size:75px;text-align:center;margin:20px">${bro?'🔴':'🏓'}</div><h2 style="text-align:center">${bro?'Find the red circle.':'I like playing table tennis.'}</h2><button class="secondary" onclick="speak('${bro?'Find the red circle.':'I like playing table tennis.'}')">▶ 听一听</button><p>${bro?'选出你听到的颜色。':'这句话表达了什么？'}</p><div class="answers">${(bro?['红色','蓝色','黄色','绿色']:['我喜欢打乒乓球','我每天去游泳','我有一个足球','我正在跑步']).map((x,i)=>`<button id="a${i}" onclick="selectAnswer(${i})">${x}</button>`).join('')}</div><div class="row"><button class="secondary" onclick="toast('${bro?'提示：red 是红色。':'提示：like 表示喜欢，table tennis 是乒乓球。'}')">给我一点提示</button><button onclick="submitLearn()">确认答案 →</button></div><div id="feedback" role="status"></div></div>`,summary:()=>`<h1>探索完成 · 任务结算</h1><div class="result-reward"><span>✦ 练习完成</span><span>💎 奖励待真实验证</span><span>🗺 新旅程待开启</span></div><p>这是原型流程小结，不表示完成真实学习计划。</p><div class="card"><h2>今天的收获</h2><div class="stats"><div class="stat">理解句意<br><b>已体验</b></div><div class="stat">学习计时<br><b>未接入</b></div><div class="stat">掌握验证<br><b>待复习</b></div></div><p>真实版本会安排延迟复习，不把一次答对当作掌握。</p><button onclick="go('match')">去训练基地</button> <button class="secondary" onclick="go('home')">今天先到这里</button></div>`,match:()=>`<div class="row"><h1>乒乓球训练基地</h1><span class="pill">系统陪练 · 演示赛</span></div><p>三局两胜 · 每局至少 11 分且领先 2 分 · 特意从 10:10 开始体验加分规则</p><div class="grid"><section class="card"><div class="court"><div>局分 ${s.wins[0]} : ${s.wins[1]}</div><div class="big">${s.score[0]} : ${s.score[1]}</div><div>你　／　系统陪练</div></div>${s.finished?'<h2 style="margin-top:20px">比赛结束，做得不错！</h2><p>演示比分不会发放真实学习积分。</p><button onclick="resetMatch()">重新体验</button>':`<h2 style="margin-top:25px">${s.round%2?'“blue” 是哪种颜色？':'“red” 是哪种颜色？'}</h2><div class="answers"><button onclick="point(${s.round%2===0})">红色</button><button onclick="point(${s.round%2===1})">蓝色</button></div><div class="notice">${Math.max(...s.score)>=10&&Math.abs(s.score[0]-s.score[1])<2?'需要领先 2 分才能赢下这一局。':'完成一个回合，也可以休息。'}</div>`}</section><section><div class="card"><h2>按自己的节奏来</h2><p>比赛可以分次完成。休息不会丢失当前比分。</p><button class="secondary" onclick="save();toast('演示比分已保存到此浏览器');go('home')">保存并休息</button></div><div class="card"><h2>月赛 / 季度赛</h2><p>五局三胜 · 正式课程接入后开启</p><button class="secondary" disabled>尚未开放</button></div></section></div>`,growth:()=>s.child==='bro'?`<h1>弟弟的成长空间 🌱</h1><div class="card"><h2>本周认识 4 / 8 个新词</h2><p>已掌握 2 个 · 本月目标 30 个</p><p>奖励交互本轮先用姐姐的演示账户展示，两名孩子正式版数据独立。</p><button onclick="switchChild('sis');go('growth')">体验姐姐的奖励流程</button></div>`:`<h1>🎒 你的冒险背包</h1><p>姐姐的成长与奖励 · 此页余额及日历为可操作演示数据</p><div class="stats"><div class="stat">可用积分<div class="big">${s.points}</div></div><div class="stat">连续天数<div class="big">${s.fixed?7:3}</div></div><div class="stat">补签卡<div class="big">${s.cards}</div></div></div><div class="grid" style="margin-top:24px"><section><div class="card"><h2>学习足迹 · 演示周</h2><div class="calendar">${Array.from({length:7},(_,i)=>`<div class="day ${i===3?(s.fixed?'fix':''):'done'}">${i===3&&!s.fixed?'<button aria-label="补签第四天" onclick="fixDialog()">4<br>补签</button>':`${i+1}<br>${i===3?'补':'✓'}`}</div>`).join('')}</div><p class="muted">绿色：实际学习 · 黄色：补签<br>补签不增加学习时长或补发每日积分。</p></div><div class="card"><h2>你的成就</h2><div class="badges"><div class="badge">🌱<br>第一次探索</div><div class="badge">🔥<br>连续 3 天</div><div class="badge">${s.fixed?'🏅':'🔒'}<br>连续 7 天</div></div></div></section><section><div class="card"><h2>家庭奖励</h2><span style="font-size:45px">🏓</span><h3>和爸爸打一场乒乓球</h3><p>50 积分 · 家长线下兑现</p><button ${s.request||s.paid?'disabled':''} onclick="s.request=true;save();render();toast('演示申请已提交，暂不扣积分')">${s.paid?'已兑现':s.request?'等待家长确认':'申请奖励'}</button><p class="muted">徽章不会因为消费消失。</p></div><div class="card"><h3>积分记录</h3><p>${s.paid?'−50 · 乒乓球奖励已兑现':'135 · 演示初始余额'}</p>${s.paid?'<p class="muted" id="note"></p>':''}</div></section></div>`,parent:()=>`<div class="row"><h1>家庭学习工作台</h1><button class="secondary" onclick="go('home')">返回孩子空间</button></div><div class="notice">演示家长区，无真实认证。正式版需要验证家长权限。</div><div class="two" style="margin-top:24px">${[['🌻 姐姐','11 / 15','8','60'],['🌱 弟弟','4 / 8','2','30']].map(([n,q,k,m])=>`<div class="card"><h2>${n}</h2><div class="big">${q} <small>本周新词</small></div><p>已验证掌握 ${k} 个 · 月目标 ${m} 个</p><div class="bar"><span style="width:60%"></span></div><span class="pill">质量检查：待验证</span><p class="muted">阅读、听说与复习分别评估，不以时长代替质量。</p><button class="secondary" onclick="planDialog()">调整任务目标</button></div>`).join('')}</div><div class="card"><div class="row"><h2>姐姐 · 家庭奖励兑现</h2><span class="pill">余额 ${s.points} 分</span></div><p>${s.paid?'已兑现：和爸爸打一场乒乓球':s.request?'待处理申请：和爸爸打一场乒乓球':'可直接登记线下兑现：和爸爸打一场乒乓球'}</p><button ${s.paid?'disabled':''} onclick="redeemDialog()">${s.paid?'已扣除 50 分':'登记兑现 · 扣除 50 分'}</button>${s.paid?'<button class="secondary" onclick="refundDialog()">撤销并退回积分</button>':''}</div><button class="link" onclick="modal('<h2>重置演示状态？</h2><p>只清除本原型在此浏览器的体验记录。</p><button onclick=\"resetAll()\">确认重置</button> <button class=\"secondary\" onclick=\"closeModal()\">取消</button>')">重置原型体验</button>`};

function missionDialog(){modal(`<h2>本周任务板</h2><p>内容数量和质量验证分开结算，演示任务不会发真实奖励。</p><div class="task">新词探索　${s.child==='bro'?'4 / 8':'11 / 15'}</div><div class="task">听说练习　1 / 2 组</div><div class="task">延迟复习　待验证</div><div class="task">月度词汇　${s.child==='bro'?'30':'60'} 个目标</div><p>已完成的学习量可以领奖，质量检查需要实际通过。</p><button onclick="closeModal();go('learn')">去完成任务</button> <button class="secondary" onclick="closeModal()">返回营地</button>`)}
function equipmentDialog(){modal(`<h2>搭档装扮</h2><p>选择装备，营地状态栏会显示名称。本轮角色是静态美术，暂不支持实时换装。不花学习积分。</p><div class="equipment-colors"><button style="background:#b5a4f5" aria-label="星云紫装备" onclick="equip('#b5a4f5','星云装备')"></button><button style="background:#72c8c3" aria-label="森林绿装备" onclick="equip('#72c8c3','森林装备')"></button><button style="background:#eec174" aria-label="日光金装备" onclick="equip('#eec174','日光装备')"></button></div><button class="secondary" onclick="closeModal()">返回营地</button>`)}
function equip(color,name){s.suit=color;s.suitName=name;save();closeModal();render();toast('已换上'+name+' · 演示装扮')}
function buildDialog(){modal(`<h2>建造自己的营地</h2><p>学习成果可以解锁营地装饰。这次免费体验建造，不扣家庭奖励积分。</p><div class="reward-build"><button class="build-choice" onclick="build('星光路牌')">${gameIcon('star')}星光路牌</button><button class="build-choice" onclick="build('训练旗帜')">${gameIcon('flag')}训练旗帜</button></div><p class="muted">正式版建造材料与可兑现积分分开，避免装修消耗线下奖励。</p><button class="secondary" onclick="closeModal()">稍后建造</button>`)}
function build(name){s.build=name;save();closeModal();render();toast('已解锁 '+name+' · 营地建造演示')}
function selectAnswer(i){answer=i;document.querySelectorAll('.answers button').forEach((b,j)=>b.classList.toggle('selected',i===j))}function submitLearn(){if(answer===null)return toast('先选择一个答案');$('feedback').innerHTML=answer===0?'<div class="notice">答对了！这只是一次练习，后续还需要复习验证。<br><button onclick="go(\'summary\')">查看小结 →</button></div>':'<div class="notice">再想一想，可以先听示范或查看提示。</div>'}function speak(t){if(!('speechSynthesis' in window))return toast('此浏览器暂不支持播放，可以阅读文字');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.onerror=()=>toast('播放失败，请使用文字继续');speechSynthesis.speak(u)}function point(right){if(s.finished)return;s.score[right?0:1]++;s.round++;if(Math.max(...s.score)>=11&&Math.abs(s.score[0]-s.score[1])>=2){let winner=s.score[0]>s.score[1]?0:1;s.wins[winner]++;if(s.wins[winner]>=2)s.finished=true;else{s.score=[0,0];toast('这一局结束，开始下一局')}}save();render()}function resetMatch(){s.score=[10,10];s.wins=[1,0];s.round=0;s.finished=false;save();render()}function fixDialog(){modal(`<h2>补签演示周第 4 天？</h2><p>消耗 1 张补签卡，连续记录恢复到 7 天。不会增加学习时长或积分。</p><button onclick="fix()">确认补签</button> <button class="secondary" onclick="closeModal()">取消</button>`)}function fix(){if(s.fixed||s.cards<1)return toast('没有可使用的补签卡');s.cards--;s.fixed=true;save();closeModal();render();toast('补签完成，获得连续 7 天演示徽章')}function redeemDialog(){modal(`<h2>确认已在线下兑现</h2><p>姐姐 · 乒乓球奖励<br>扣除 50 分，剩余 ${s.points-50} 分</p><label>消费备注<input id="memo" placeholder="例如：周六下午已兑现" maxlength="200"></label><button onclick="redeem()">确认兑现并扣分</button> <button class="secondary" onclick="closeModal()">取消</button>`)}function redeem(){if(s.paid||s.points<50)return toast('无法重复兑现或余额不足');s.note=$('memo').value;s.points-=50;s.paid=true;s.request=false;save();closeModal();render();toast('已登记演示兑现及备注')}function refundDialog(){modal('<h2>撤销这次兑现？</h2><p>退回原扣除的 50 分。</p><label>撤销原因<input id="reason" maxlength="200"></label><button onclick="refund()">确认撤销</button> <button class="secondary" onclick="closeModal()">取消</button>')}function refund(){if(!s.paid)return; if(!$('reason').value.trim())return toast('请填写撤销原因');s.points+=50;s.paid=false;s.refundReason=$('reason').value;save();closeModal();render();toast('演示积分已退回')}function planDialog(){modal('<h2>任务目标 · 设计演示</h2><label>每周新词<input type="number" value="15" min="1" max="100"></label><label>每月新词<input type="number" value="60" min="1" max="300"></label><p>正式版将保存变更记录并重新分配短任务。本弹窗仅展示交互。</p><button onclick="closeModal();toast(\'已体验设置流程，未修改真实计划\')">完成体验</button>')}function resetAll(){s={...initial,score:[10,10],wins:[1,0]};save();closeModal();go('home')}render();
</script></body></html>
